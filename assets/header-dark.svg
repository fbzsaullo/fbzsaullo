<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Fabrízio Saullo — Full-stack developer">
<title>Fabrízio Saullo — Full-stack developer</title>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c8ff0"/><stop offset="1" stop-color="#9b6fd0"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#30363d"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="fadeMask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
  <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="14"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="300" fill="#0d1117"/>
  <rect x="560" y="0" width="640" height="300" fill="url(#dots)" mask="url(#fadeMask)"/>
  <rect x="64" y="80" width="10" height="10" fill="url(#accent)"/>
  <text x="86" y="91" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" letter-spacing="2.4" fill="#8b949e">FULL-STACK DEVELOPER</text>
  <text x="62" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#e6edf3">Fabrízio Saullo</text>
  <text x="64" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="25" fill="#8b949e">Sistemas web, apps desktop e automações com IA.</text>
  <text x="64" y="254" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#8b949e">São Paulo, Brasil  ·  <tspan fill="#e6edf3">fbz.dev</tspan></text>
  <rect x="790" y="58" width="350" height="190" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="812" cy="78" r="5" fill="#30363d"/>
  <circle cx="830" cy="78" r="5" fill="#30363d"/>
  <circle cx="848" cy="78" r="5" fill="#30363d"/>
  <line x1="790" y1="96" x2="1140" y2="96" stroke="#30363d"/>
  <rect x="818" y="110" width="120" height="7" rx="3.5" fill="url(#accent)"/>
  <rect x="840" y="142" width="90" height="7" rx="3.5" fill="#30363d"/>
  <rect x="840" y="158" width="170" height="7" rx="3.5" fill="#21262d"/>
  <rect x="862" y="174" width="140" height="7" rx="3.5" fill="url(#accent)"/>
  <rect x="862" y="190" width="100" height="7" rx="3.5" fill="#21262d"/>
  <rect x="840" y="206" width="60" height="7" rx="3.5" fill="#30363d"/>
  <rect x="818" y="222" width="40" height="7" rx="3.5" fill="url(#accent)"/>
  <rect x="866" y="222" width="2" height="9" fill="#e6edf3"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
</g>
<rect x="1" y="1" width="1198" height="298" rx="14" fill="none" stroke="#30363d" stroke-width="1.2"/>
